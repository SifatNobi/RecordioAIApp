name: Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

permissions:
  contents: write
  packages: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release'
    env:
      CI: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK (release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify release APK is self-contained
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::release APK not found at $APK"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          test "$SIZE" -gt 10000000 || { echo "::error::release APK too small ($SIZE bytes)"; exit 1; }
          echo "APK size: $SIZE bytes (OK)"
          if unzip -p "$APK" assets/index.android.bundle > /dev/null 2>&1; then
            echo "Verified: assets/index.android.bundle is packaged inside the APK"
          else
            echo "::error::assets/index.android.bundle is MISSING from the APK - release would need Metro"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecordioAI-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## RecordioAI Android Release
            
            ### Installation
            1. Download the APK file
            2. Enable "Install unknown apps" in Android settings
            3. Open the APK to install
            
            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-aab:
    name: Build Android AAB (Release)
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    env:
      CI: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android AAB (release)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Verify release AAB is self-contained
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::release AAB not found at $AAB"; exit 1; }
          SIZE=$(stat -c%s "$AAB")
          test "$SIZE" -gt 10000000 || { echo "::error::release AAB too small ($SIZE bytes)"; exit 1; }
          echo "AAB size: $SIZE bytes (OK)"
          if unzip -l "$AAB" 2>/dev/null | grep -q "assets/index.android.bundle"; then
            echo "Verified: assets/index.android.bundle is packaged inside the AAB"
          else
            echo "::error::assets/index.android.bundle is MISSING from the AAB - release would need Metro"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecordioAI-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30