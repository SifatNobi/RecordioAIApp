name: Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

permissions:
  contents: write
  packages: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

  build-android:
    name: Build Android Test APK (debug + Test Store)
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release'
    env:
      CI: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Free CI runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          df -h "$HOME"

      - name: Build Android Test APK (debug, universal ABIs)
        run: |
          # No reactNativeArchitectures pin: the generated android/gradle.properties
          # uses the Gradle default, so the debug APK bundles ALL technically
          # supported ABIs (arm64-v8a, armeabi-v7a, x86_64, x86) as a single
          # directly-installable UNIVERSAL APK. This makes the artifact installable
          # on real phones (ARM) and emulators (x86_64) alike.
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify debug test APK is self-contained
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::debug APK not found at $APK"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          test "$SIZE" -gt 10000000 || { echo "::error::debug APK too small ($SIZE bytes)"; exit 1; }
          echo "APK size: $SIZE bytes (OK)"
          if unzip -p "$APK" assets/index.android.bundle > /dev/null 2>&1; then
            echo "Verified: assets/index.android.bundle is packaged inside the debug APK (runs WITHOUT Metro)"
          else
            echo "::error::assets/index.android.bundle is MISSING from the debug APK - it would require Metro"
            exit 1
          fi

      - name: Name the test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RecordioAI-debug-teststore.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecordioAI-debug-teststore
          path: RecordioAI-debug-teststore.apk
          retention-days: 30

      - name: Upload test APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: RecordioAI-debug-teststore.apk
          body: |
            ## RecordioAI Android Test Store Build

            ### Installation
            1. Download the APK file
            2. Enable "Install unknown apps" in Android settings
            3. Open the APK to install

            ### Notes
            This is a DEBUG/Test Store build using the RevenueCat **Test Store** API key
            (`test_*`). Test purchases are simulated and generate no revenue.
            The APK is self-contained (no Metro / localhost connection required).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}