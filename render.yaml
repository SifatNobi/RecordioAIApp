services:
  - type: web
    name: recordioai-backend
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
    autoDeploy: true
    rootDir: backend